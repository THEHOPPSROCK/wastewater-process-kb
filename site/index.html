<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>污泥处理工艺知识库 SLUDGE-TECH DATABASE // 2077</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<header class="hud-header">
  <div class="brand">
    <h1 class="brand-title">污泥处理工艺知识库</h1>
    <div class="brand-sub">SLUDGE-TECH DATABASE <span class="brand-year">// 2077</span></div>
  </div>
  <div class="hud-stats" id="hudStats" aria-label="数据统计">
    <span class="stat"><b class="stat-num" id="statCats">--</b><span class="stat-label">大类</span></span>
    <span class="stat-sep">/</span>
    <span class="stat"><b class="stat-num" id="statVars">--</b><span class="stat-label">变种</span></span>
    <span class="stat-sep">/</span>
    <span class="stat"><b class="stat-num" id="statForms">--</b><span class="stat-label">公式</span></span>
  </div>
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="搜索 SEARCH · 中文 / EN / 年份" autocomplete="off" aria-label="搜索工艺">
    <span class="search-corner" aria-hidden="true"></span>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" id="tabPeriodic" role="tab" aria-selected="true" data-view="periodic">周期表 <span class="tab-en">PERIODIC</span></button>
  <button class="tab" id="tabFormulas" role="tab" aria-selected="false" data-view="formulas">公式手册 <span class="tab-en">FORMULAS</span></button>
</nav>

<main id="main">
  <section id="viewPeriodic" class="view active" aria-label="周期表视图">
    <div class="ptable-scroll" id="ptableScroll">
      <div class="ptable" id="ptable"><!-- JS 渲染 --></div>
    </div>
    <div class="legend-row" id="familyLegend"><!-- family 图例 --></div>
  </section>

  <section id="viewFormulas" class="view" aria-label="公式手册视图">
    <aside class="fchapters" id="fchapters"><!-- 章节导航 --></aside>
    <div class="fmain">
      <div class="fsearch">
        <input id="formulaSearch" type="search" placeholder="章节内过滤 FILTER · 编号 / 名称 / 符号" aria-label="过滤公式">
      </div>
      <div id="flist"><!-- 公式列表 --></div>
    </div>
  </section>
</main>

<!-- 二级 drawer：大类 / 变种列表 -->
<div class="drawer-mask" id="drawerMask" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="工艺大类详情" hidden>
  <div class="drawer-inner" id="drawerInner"></div>
</aside>

<!-- 三级 modal：变种详情 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="工艺变种详情" hidden>
  <div class="modal-panel" id="modalPanel"></div>
</div>

<script src="data/processes.js"></script>
<script src="data/formulas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
